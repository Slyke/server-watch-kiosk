# Repeat this namespace-scoped Role/RoleBinding ONLY for allowed namespaces.
# This example binds the monitoring service account in the "apps" namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-board-reader
  namespace: apps
rules:
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-board-reader
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: service-watcher-kiosk
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: service-board-reader
