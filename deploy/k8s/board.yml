# Review-only example. No live cluster modifications are performed by this project.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-watcher-kiosk
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-watcher-kiosk
  namespace: monitoring
data:
  config.json5: |
    {
      schemaVersion: 1,
      server: { host: '0.0.0.0', port: 8098 },
      demo: { enabled: true },
      uiDefaults: { theme: 'reference', optionsEnabled: true },
      plugins: { directory: '/app/checks', enabled: [], allowHotReload: false },
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-watcher-kiosk
  namespace: monitoring
  labels:
    app.kubernetes.io/name: service-watcher-kiosk
    app.kubernetes.io/version: '0.1.0'
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: service-watcher-kiosk }
  template:
    metadata:
      labels: { app.kubernetes.io/name: service-watcher-kiosk }
      annotations:
        service-watcher-kiosk/buildHash: REPLACE_WITH_BUILD_HASH
    spec:
      serviceAccountName: service-watcher-kiosk
      # Enable only when a configured source explicitly uses inCluster: true.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: board
          image: registry.example.com/team/service-watcher-kiosk:0.1.0-REPLACE_WITH_BUILD_HASH
          ports: [{ name: http, containerPort: 8098 }]
          env:
            - { name: CONFIG_FILE, value: /config/config.json5 }
            - { name: SECRETS_FILE, value: /run/secrets/secrets.json5 }
            - { name: LOG_K8S_METADATA_ENABLED, value: 'true' }
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '2', memory: 512Mi }
          livenessProbe: { httpGet: { path: /livez, port: http }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 2 }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: service-watcher-kiosk }
        - name: secrets
          secret: { secretName: service-watcher-kiosk, optional: true }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: service-watcher-kiosk
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: service-watcher-kiosk }
  ports: [{ name: http, port: 8098, targetPort: http }]
