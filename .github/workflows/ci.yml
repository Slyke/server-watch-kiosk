name: Verify service board
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run error-validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:docker
      - run: docker compose config --quiet
      - run: docker build --build-arg BUILD_HASH=${{ github.sha }} -t service-watcher-kiosk:test .
      - run: node scripts/smoke-container.mjs service-watcher-kiosk:test
